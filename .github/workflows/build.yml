name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# contents: write lets the job publish the APK to the "latest-debug" release.
permissions:
  contents: write

# A newer push supersedes an older build (and its release upload) on the same branch.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs cmdline-tools, sets ANDROID_HOME/ANDROID_SDK_ROOT, accepts licenses, and installs
      # the listed packages. The default package list includes the removed legacy "tools" package,
      # so the list is given explicitly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: DoseTrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Artifacts always download as .zip; a release asset downloads as the raw .apk.
      # The "latest-debug" pre-release is replaced on every push to main.
      - name: Publish APK to the latest-debug release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DoseTrack-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug DoseTrack-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "DoseTrack latest debug build" \
            --notes "DoseTrack debug APK built from commit $GITHUB_SHA (run #$GITHUB_RUN_NUMBER). Install DoseTrack-debug.apk directly on your phone."
